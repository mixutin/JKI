[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jki-voice"
version = "0.2.0"
description = "A Linux voice companion for Codex with local speech processing and explicit human control"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JKI contributors"}]
keywords = ["linux", "codex", "voice", "speech", "gtk", "pipewire", "accessibility"]
dependencies = ["websockets>=14,<17"]

[project.optional-dependencies]
audio = ["faster-whisper>=1.2.1,<2", "numpy>=2,<3", "onnxruntime>=1.20,<2", "vosk>=0.3.45,<0.4"]
piper = ["piper-tts>=1.8,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[project.scripts]
jki = "jki.cli:main"

[project.urls]
Repository = "https://github.com/ridjan-xhika/JKI"
Issues = "https://github.com/ridjan-xhika/JKI/issues"

[tool.setuptools]
packages = ["jki"]
py-modules = ["engine", "music", "orb", "jake"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
