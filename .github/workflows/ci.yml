name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -v
      - run: ruff check .
      - run: mypy jki/config.py jki/state.py jki/text.py jki/speech_queue.py
      - run: python -m compileall -q jki tests
      - run: python -m build
      - run: python tools/wheel_smoke.py dist
  gtk-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-4.0 xvfb
      - run: /usr/bin/python3 -m venv --system-site-packages .gui-venv
      - run: .gui-venv/bin/python -m pip install .
      - run: xvfb-run -a .gui-venv/bin/python tools/gui_smoke.py
